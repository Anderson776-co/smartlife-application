spring.application.name=smartlife-api
smartlife.cors.allowed-origins=http://localhost:5173
spring.datasource.url=jdbc:h2:mem:smartlife;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
smartlife.visits.qr-base-url=http://localhost:5173/visitas/autorizaciones/

spring.cache.type=none

management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.health.redis.enabled=false

# Idiomas (los lee LocaleConfig; en produccion vienen de application.properties)
smartlife.i18n.default-locale=es
smartlife.i18n.supported-locales=es
