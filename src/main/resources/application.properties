spring.application.name=smartlife-api

# Config Server (parametros). "optional:" permite arrancar aunque este caido
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Tiempos de espera del Config Server, en milisegundos. Si no responde a tiempo,
# la aplicacion arranca con los valores de respaldo de este archivo.
spring.cloud.config.request-connect-timeout=5000
spring.cloud.config.request-read-timeout=30000

# Base de datos 
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Strapi (catalogo de mensajes y de notificaciones)
strapi.url=${STRAPI_URL:}
strapi.api-token=${STRAPI_API_TOKEN:}
# Rutas de la API de Strapi y tiempos de espera (se leen una sola vez, al arrancar). Se ajustan con variables de entorno.
strapi.message-catalog-path=/api/message-catalogs
strapi.notification-catalog-path=/api/notification-catalogs
strapi.connect-timeout=${STRAPI_CONNECT_TIMEOUT:3s}
strapi.read-timeout=${STRAPI_READ_TIMEOUT:5s}

# Resend (correos)
resend.url=https://api.resend.com
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}
resend.emails-path=/emails
resend.connect-timeout=${RESEND_CONNECT_TIMEOUT:3s}
resend.read-timeout=${RESEND_READ_TIMEOUT:10s}

# Cloudflare R2 (archivos)
r2.endpoint=${R2_ENDPOINT:}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket=${R2_BUCKET:}

# Firebase y sesion por cookie
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}
smartlife.session.duration=${SESSION_DURATION:5d}
smartlife.session.cookie-name=${SESSION_COOKIE_NAME:__Host-smartlife_session}
smartlife.session.check-revoked=${SESSION_CHECK_REVOKED:true}
smartlife.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Parametros de visitas: valores de respaldo (Config Server los sobrescribe)
smartlife.visits.max-authorization-duration=24h
smartlife.visits.max-anticipation=30d
smartlife.visits.start-tolerance=10m
smartlife.visits.document.max-size=5MB
smartlife.visits.document.allowed-types=application/pdf,image/jpeg,image/png
smartlife.visits.time-zone=UTC

# Carga de archivos: tope duro de Spring; el limite de negocio (5MB) lo valida el caso de uso
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.cache.type=${CACHE_TYPE:none}
spring.cache.cache-names=message-catalog,notification-catalog
spring.cache.redis.time-to-live=${CACHE_TTL:1h}
spring.cache.redis.key-prefix=smartlife::
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}

# Actuator (protege /actuator/** con rol ADMIN en SecurityConfiguration)
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# Telemetria (OpenTelemetry). Apagada por defecto. Envia los datos por OTLP/HTTP a un collector de OpenTelemetry
# que corre junto a la aplicacion (localhost:4318), y el collector los reenvia a Google Cloud (Managed Service
# for Prometheus y Cloud Trace). Las propiedades de trazas usan el prefijo de Spring Boot 4: management.opentelemetry.
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
management.tracing.export.otlp.enabled=${OTLP_TRACING_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=${OTLP_METRICS_STEP:60s}

# Webhooks (Strapi y Config Server)
smartlife.webhooks.strapi-secret=${STRAPI_WEBHOOK_SECRET:}
smartlife.webhooks.config-secret=${CONFIG_WEBHOOK_SECRET:}
smartlife.webhooks.config-ref=${CONFIG_WEBHOOK_REF:refs/heads/main}

# Idiomas con contenido publicado en Strapi.
smartlife.i18n.default-locale=${DEFAULT_LOCALE:es}
smartlife.i18n.supported-locales=${SUPPORTED_LOCALES:es}