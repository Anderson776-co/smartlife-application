spring.application.name=smartlife-api

# Config Server (parámetros). "optional:" permite arrancar aunque esté caído
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Base de datos 
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Strapi (catálogo de mensajes y de notificaciones)
strapi.url=${STRAPI_URL:}
strapi.api-token=${STRAPI_API_TOKEN:}

# Resend (correos)
resend.url=https://api.resend.com
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

# Cloudflare R2 (archivos)
r2.endpoint=${R2_ENDPOINT:}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket=${R2_BUCKET:}

# Firebase y sesión por cookie
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}
smartlife.session.duration=${SESSION_DURATION:5d}
smartlife.session.cookie-name=${SESSION_COOKIE_NAME:__Host-smartlife_session}
smartlife.session.check-revoked=${SESSION_CHECK_REVOKED:true}
smartlife.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Parámetros de visitas: valores de respaldo (Config Server los sobrescribe)
smartlife.visits.max-authorization-duration=24h
smartlife.visits.max-anticipation=30d
smartlife.visits.start-tolerance=10m
smartlife.visits.document.max-size=5MB
smartlife.visits.document.allowed-types=application/pdf,image/jpeg,image/png
smartlife.visits.qr-base-url=${QR_BASE_URL:http://localhost:5173/visitas/autorizaciones/}
smartlife.visits.time-zone=UTC

# Carga de archivos: tope duro de Spring; el límite de negocio (5MB) lo valida el caso de uso
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.cache.type=${CACHE_TYPE:none}
spring.cache.cache-names=message-catalog,notification-catalog
spring.cache.redis.time-to-live=${CACHE_TTL:1h}
spring.cache.redis.key-prefix=smartlife::
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Actuator (protege /actuator/** con rol ADMIN en SecurityConfiguration)
management.endpoints.web.exposure.include=health,refresh

