swagger: "2.0"
info:
  title: smartlife-api
  description: Puerta de entrada de SmartLife (API Gateway de Google) hacia el servicio smartlife-application en Cloud Run.
  version: "1.0.0"
schemes:
  - https
produces:
  - application/json
x-google-backend:
  address: https://smartlife-application-clfarpgyxa-uc.a.run.app
  path_translation: APPEND_PATH_TO_ADDRESS
  deadline: 60.0
securityDefinitions:
  api_key:
    type: apiKey
    name: x-api-key
    in: header
security:
  - api_key: []
paths:
  /api/v1/users/sessions/csrf:
    get:
      summary: Entrega la cookie XSRF-TOKEN
      operationId: csrf
      responses:
        "204":
          description: Cookie entregada
    options:
      summary: Verificacion previa de CORS
      operationId: csrfOptions
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/users/sessions:
    post:
      summary: Inicio de sesion con el token de Firebase
      operationId: login
      consumes:
        - application/json
      responses:
        "200":
          description: Sesion creada
    options:
      summary: Verificacion previa de CORS
      operationId: loginOptions
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/users/sessions/me:
    get:
      summary: Usuario de la sesion actual
      operationId: me
      responses:
        "200":
          description: Usuario actual
    options:
      summary: Verificacion previa de CORS
      operationId: meOptions
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/users/sessions/logout:
    post:
      summary: Cierre de sesion
      operationId: logout
      responses:
        "200":
          description: Sesion cerrada
    options:
      summary: Verificacion previa de CORS
      operationId: logoutOptions
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/visits/authorizations:
    get:
      summary: Autorizaciones de quien tiene la sesion, por paginas, de la mas reciente a la mas antigua
      operationId: listVisitAuthorizations
      parameters:
        - name: isActive
          in: query
          required: false
          type: boolean
          description: true para las autorizaciones activas, false para las canceladas; sin valor trae todas
        - name: from
          in: query
          required: false
          type: string
          description: Inicio del rango de fechas (ISO-8601, por ejemplo 2026-11-03T15:00:00Z)
        - name: to
          in: query
          required: false
          type: string
          description: Fin del rango de fechas (ISO-8601)
        - name: propertyId
          in: query
          required: false
          type: string
          description: Identificador de la propiedad
        - name: page
          in: query
          required: false
          type: integer
          default: 0
          description: Numero de pagina, empezando en 0
        - name: size
          in: query
          required: false
          type: integer
          default: 10
          description: Autorizaciones por pagina (maximo 50)
      responses:
        "200":
          description: Pagina de autorizaciones de la persona
    post:
      summary: Autoriza la visita de una persona, con documento adjunto opcional
      operationId: authorizeVisit
      consumes:
        - multipart/form-data
      responses:
        "200":
          description: Autorizacion creada
    options:
      summary: Verificacion previa de CORS
      operationId: authorizeVisitOptions
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/visits/authorizations/{authorizationId}:
    get:
      summary: Una autorizacion de quien tiene la sesion
      operationId: getVisitAuthorization
      parameters:
        - name: authorizationId
          in: path
          required: true
          type: string
          description: Identificador de la autorizacion
      responses:
        "200":
          description: La autorizacion
        "400":
          description: No existe o es de otra persona
    options:
      summary: Verificacion previa de CORS
      operationId: getVisitAuthorizationOptions
      parameters:
        - name: authorizationId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/visits/reasons:
    get:
      summary: Motivos de visita disponibles para autorizar una visita
      operationId: listVisitReasons
      responses:
        "200":
          description: Lista de motivos de visita
    options:
      summary: Verificacion previa de CORS
      operationId: listVisitReasonsOptions
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/users/{userId}/status:
    patch:
      summary: Activa o desactiva un usuario (solo administrador)
      operationId: changeUserStatus
      consumes:
        - application/json
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: Identificador del usuario
      responses:
        "200":
          description: Estado cambiado; se actualizan las vistas de los otros modulos
        "400":
          description: Dato invalido o no existe
        "403":
          description: Solo el administrador puede hacerlo
    options:
      summary: Verificacion previa de CORS
      operationId: changeUserStatusOptions
      parameters:
        - name: userId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/urbanizations/{urbanizationId}:
    patch:
      summary: Cambia el nombre de una urbanizacion (solo administrador)
      operationId: renameUrbanization
      consumes:
        - application/json
      parameters:
        - name: urbanizationId
          in: path
          required: true
          type: string
          description: Identificador de la urbanizacion
      responses:
        "200":
          description: Nombre cambiado; se actualizan las vistas de los otros modulos
        "400":
          description: Dato invalido o no existe
        "403":
          description: Solo el administrador puede hacerlo
    options:
      summary: Verificacion previa de CORS
      operationId: renameUrbanizationOptions
      parameters:
        - name: urbanizationId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/dwellings/{dwellingId}/owner:
    patch:
      summary: Cambia el propietario de una vivienda (solo administrador)
      operationId: changeDwellingOwner
      consumes:
        - application/json
      parameters:
        - name: dwellingId
          in: path
          required: true
          type: string
          description: Identificador de la vivienda
      responses:
        "200":
          description: Propietario cambiado; se actualizan las vistas de los otros modulos
        "400":
          description: Dato invalido o no existe
        "403":
          description: Solo el administrador puede hacerlo
    options:
      summary: Verificacion previa de CORS
      operationId: changeDwellingOwnerOptions
      parameters:
        - name: dwellingId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/residents/residences/{residentResidenceId}/status:
    patch:
      summary: Activa o desactiva la relacion de un residente con una residencia (solo administrador)
      operationId: changeResidentResidenceStatus
      consumes:
        - application/json
      parameters:
        - name: residentResidenceId
          in: path
          required: true
          type: string
          description: Identificador de la relacion residente-residencia
      responses:
        "200":
          description: Estado cambiado; se actualizan las vistas de los otros modulos
        "400":
          description: Dato invalido o no existe
        "403":
          description: Solo el administrador puede hacerlo
    options:
      summary: Verificacion previa de CORS
      operationId: changeResidentResidenceStatusOptions
      parameters:
        - name: residentResidenceId
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Respuesta de la aplicacion
  /api/v1/internal/webhooks/strapi:
    post:
      summary: Webhook de Strapi para invalidar la cache del catalogo
      operationId: strapiWebhook
      consumes:
        - application/json
      responses:
        "200":
          description: Evento procesado
        "401":
          description: Secreto invalido
  /api/v1/internal/webhooks/config:
    post:
      summary: Webhook de GitHub para recargar los parametros
      operationId: configWebhook
      consumes:
        - application/json
      responses:
        "200":
          description: Ping o evento ignorado
        "202":
          description: Recarga aceptada
        "401":
          description: Firma invalida
  